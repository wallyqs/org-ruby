name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
        highlighter:
          - { name: none, without: 'pygments:coderay' }
          - { name: coderay, without: 'pygments' }
          - { name: pygments, without: 'coderay' }
    name: Ruby ${{ matrix.ruby }} (${{ matrix.highlighter.name }})
    env:
      BUNDLE_WITHOUT: ${{ matrix.highlighter.without }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.highlighter.name == 'pygments'
        with:
          python-version: '3.x'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
